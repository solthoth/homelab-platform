# Full kube-proxy replacement. k8sServiceHost/Port point at Talos's KubePrism
# (a local API-server proxy on every node's localhost:7445) instead of the
# control-plane IP directly, so this keeps working across CP changes/HA later.
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

ipam:
  mode: kubernetes

# Talos uses cgroup v2 and mounts it itself -- Cilium must not try to mount
# its own, or it'll fight Talos for the mount point.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos blocks CAP_SYS_MODULE and CAP_SYS_BOOT for every container, even
# privileged ones (it's an immutable OS -- no dynamic kernel modules, no
# in-container reboot). Cilium's chart defaults request them anyway, which
# fails init containers with "unable to apply caps: operation not permitted".
# These lists are the chart defaults minus those two.
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

# Shared-mode Ingress: one LoadBalancer Service ("cilium-ingress" in kube-system)
# backs every Ingress resource cluster-wide, so a future addon just adds its
# own Ingress object -- no new LB IP/pool/L2 policy needed per service.
ingressController:
  enabled: true
  loadbalancerMode: shared
  default: true      # IngressClass "cilium" becomes the cluster default
  enforceHttps: true # redirect plain-HTTP hits to HTTPS

# LB-IPAM is enabled by default but only allocates an IP at the Kubernetes API
# level -- nothing answers ARP for it on the k8s-external L2 segment without
# this. The Windows host sits on that segment (it's the NAT gateway), so this
# is what makes the shared-ingress IP reachable from the host at all -- see
# addons/cilium-lb-pool/ for the pool + policy, and
# infrastructure/hyper-v/lan-ingress-bridge.ps1 for bridging it to the rest of
# the home LAN.
l2announcements:
  enabled: true
