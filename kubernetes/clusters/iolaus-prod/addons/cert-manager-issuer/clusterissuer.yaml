# clientID/subscriptionID/tenantID/resourceGroupName are not secret and are
# committed here -- REPLACE THE REMAINING PLACEHOLDERS below once the Azure
# Service Principal exists. Only the Service Principal's client secret is
# sensitive; it lives in the "azuredns-config" Secret created out-of-band
# (see kubernetes/README.md), never committed to git.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-azuredns
spec:
  acme:
    email: "soldotsol@gmail.com"
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretRef:
      name: letsencrypt-azuredns-key
    solvers:
      - dns01:
          azureDNS:
            clientID: "<AZURE_SP_CLIENT_ID>"
            clientSecretSecretRef:
              name: azuredns-config
              key: client-secret
            subscriptionID: "<AZURE_SUBSCRIPTION_ID>"
            tenantID: "<AZURE_TENANT_ID>"
            resourceGroupName: "<AZURE_DNS_RESOURCE_GROUP>"
            hostedZoneName: "bitandbyteideas.com"
            environment: AzurePublicCloud
