# clientID/subscriptionID/tenantID/resourceGroupName are not secret and are
# committed here directly. Only the Service Principal's client secret is
# sensitive -- it lives in azuredns-config.enc.yaml (SOPS-encrypted with Age,
# decrypted by ArgoCD's repo-server via KSOPS at sync time; see
# kubernetes/README.md's "Secrets (SOPS + Age)" section), not this file.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-azuredns
spec:
  acme:
    email: "soldotsol@gmail.com"
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretRef:
      name: letsencrypt-azuredns-key
    solvers:
      - dns01:
          azureDNS:
            clientID: "600a7b12-3443-4da3-93bf-cef77672a139"
            clientSecretSecretRef:
              name: azuredns-config
              key: client-secret
            subscriptionID: "0d84648f-60b2-4962-9d98-9ba0d9bebeb5"
            tenantID: "e0c906a3-b766-47db-afcc-c7f76a5cea7a"
            resourceGroupName: "rg-bit-and-byte-ideas-website-prod"
            hostedZoneName: "bitandbyteideas.com"
            environment: AzurePublicCloud
